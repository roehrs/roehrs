name: Cobra do gráfico de contribuições

on:
  schedule:
    # Todo dia às 06:20 BRT (09:20 UTC), 20 min depois do metrics
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar a animação
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: roehrs
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
